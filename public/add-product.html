<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Product - Local Marketplace</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="button-styles.css">
  <style>
    .form-container {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border-radius: 15px;
      padding: 40px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      max-width: 600px;
      margin: 0 auto;
    }
    
    .form-group {
      margin-bottom: 20px;
    }
    
    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: #333;
    }
    
    .form-group input,
    .form-group textarea,
    .form-group select {
      width: 100%;
      padding: 12px;
      border: 2px solid #e9ecef;
      border-radius: 8px;
      font-size: 16px;
      transition: border-color 0.3s;
    }
    
    .form-group input:focus,
    .form-group textarea:focus,
    .form-group select:focus {
      outline: none;
      border-color: #667eea;
    }
    
    .form-group textarea {
      resize: vertical;
      min-height: 100px;
    }
    
    .btn-submit {
      background: linear-gradient(45deg, #667eea, #764ba2);
      color: white;
      border: none;
      padding: 15px 30px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      width: 100%;
      margin-top: 20px;
    }
    
    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
    }
    
    .btn-cancel {
      background: #6c757d;
      color: white;
      border: none;
      padding: 15px 30px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      text-decoration: none;
      display: inline-block;
      margin-right: 10px;
    }
    
    .btn-cancel:hover {
      background: #5a6268;
    }
    
    .button-group {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }
    
    .required {
      color: #dc3545;
    }
  </style>
</head>
<body>
  <header class="header">
    <nav class="nav">
      <div class="logo">Local Marketplace</div>
      <ul class="nav-links">
        <li><a href="/">Home</a></li>
        <li><a href="/overview">Products</a></li>
        <li><a href="/api">API</a></li>
      </ul>
    </nav>
  </header>

  <main class="main-content">
    <div class="form-container">
      <h1 style="text-align: center; margin-bottom: 30px; color: #333;">Add New Product</h1>
      
      <form action="/add-product" method="POST" id="addProductForm">
        <div class="form-group">
          <label for="name">Product Name <span class="required">*</span></label>
          <input type="text" id="name" name="name" required placeholder="Enter product name">
        </div>
        
        <div class="form-group">
          <label for="price">Price (₱) <span class="required">*</span></label>
          <input type="number" id="price" name="price" required min="0" step="0.01" placeholder="0.00">
        </div>
        
        <div class="form-group">
          <label for="category">Category <span class="required">*</span></label>
          <select id="category" name="category" required>
            <option value="">Select a category</option>
            <option value="Electronics">Electronics</option>
            <option value="Books">Books</option>
            <option value="Clothing">Clothing</option>
            <option value="Sports">Sports</option>
            <option value="Home Appliances">Home Appliances</option>
            <option value="Accessories">Accessories</option>
            <option value="Fashion">Fashion</option>
            <option value="Photography">Photography</option>
            <option value="Other">Other</option>
          </select>
        </div>
        
        <div class="form-group">
          <label for="description">Description</label>
          <textarea id="description" name="description" placeholder="Describe your product (condition, features, etc.)"></textarea>
        </div>
        
        <div class="form-group">
          <label for="seller">Seller Name <span class="required">*</span></label>
          <input type="text" id="seller" name="seller" required placeholder="Your name">
        </div>
        
        <div class="button-group">
          <a href="/overview" class="btn-cancel">Cancel</a>
          <button type="submit" class="btn-submit">Add Product</button>
        </div>
      </form>
    </div>
  </main>

  <footer class="footer">
    <p>&copy; 2026 Local Marketplace. Built with Node.js & Express.</p>
  </footer>

  <script>
    // Form validation
    document.getElementById('addProductForm').addEventListener('submit', function(e) {
      const name = document.getElementById('name').value.trim();
      const price = document.getElementById('price').value;
      const category = document.getElementById('category').value;
      const seller = document.getElementById('seller').value.trim();
      
      if (!name || !price || !category || !seller) {
        e.preventDefault();
        alert('Please fill in all required fields.');
        return;
      }
      
      if (parseFloat(price) <= 0) {
        e.preventDefault();
        alert('Price must be greater than 0.');
        return;
      }
    });
  </script>
</body>
</html>
