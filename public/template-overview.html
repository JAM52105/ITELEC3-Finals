<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Local Marketplace - Overview</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="button-styles.css">
</head>
<body>
  <header class="header">
    <nav class="nav">
      <div class="logo">Local Marketplace</div>
      <ul class="nav-links">
        <li><a href="/">Home</a></li>
        <li><a href="/api">API</a></li>
      </ul>
    </nav>
  </header>

  <main class="main-content">
    <div class="page-header">
      <h1>Discover Amazing Products</h1>
      <button class="btn-add-product" onclick="window.location.href='/add-product'">+ Add Product</button>
    </div>
    <div class="products-grid">
      {%PRODUCT_CARDS%}
    </div>
  </main>

  <footer class="footer">
    <p>&copy; 2026 Local Marketplace. Built with Node.js & Express.</p>
  </footer>
</body>
</html>
