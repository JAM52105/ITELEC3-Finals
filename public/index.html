<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Local Marketplace API</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 50px auto;
      text-align: center;
    }
    h1 {
      color: #333;
      margin-bottom: 30px;
    }
    .buttons {
      display: flex;
      gap: 20px;
      justify-content: center;
      flex-wrap: wrap;
    }
    button {
      padding: 15px 30px;
      font-size: 16px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      transition: background-color 0.3s;
    }
    .btn-products {
      background-color: #007bff;
      color: white;
    }
    .btn-products:hover {
      background-color: #0056b3;
    }
    .btn-api {
      background-color: #28a745;
      color: white;
    }
    .btn-api:hover {
      background-color: #1e7e34;
    }
    .btn-link {
      text-decoration: none;
      display: inline-block;
    }
  </style>
</head>
<body>
  <h1>Welcome to Local Marketplace API</h1>
  <div class="buttons">
    <a href="/overview" class="btn-link">
      <button class="btn-products">
        View Products
      </button>
    </a>
    <a href="/api?limit=10" class="btn-link">
      <button class="btn-api">
        View API Data
      </button>
    </a>
  </div>
</body>
</html>
